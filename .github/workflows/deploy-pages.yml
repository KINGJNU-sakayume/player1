name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is already publishing.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      # Fails with a clear message until Settings → Pages → Source is set to "GitHub Actions".
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build
        run: npm run build
        env:
          # "/player1" for https://<owner>.github.io/player1/, "" on a custom domain.
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/
          # Repository variables: Settings → Secrets and variables → Actions → Variables.
          # Everything here ends up in the public bundle; a Spotify client ID is public, a client secret never belongs here.
          # Unset variables fall back to the defaults in README.md; the redirect URI defaults to <site URL>/callback.
          VITE_SPOTIFY_CLIENT_ID: ${{ vars.VITE_SPOTIFY_CLIENT_ID }}
          VITE_SPOTIFY_REDIRECT_URI: ${{ vars.VITE_SPOTIFY_REDIRECT_URI }}
          VITE_LYRICS_PROVIDER: ${{ vars.VITE_LYRICS_PROVIDER }}
          VITE_TRANSLATION_PROVIDER: ${{ vars.VITE_TRANSLATION_PROVIDER }}
          VITE_TRANSLATION_ENDPOINT: ${{ vars.VITE_TRANSLATION_ENDPOINT }}
          VITE_TRANSLATION_TARGET: ${{ vars.VITE_TRANSLATION_TARGET }}
          VITE_ENABLE_PREVIEW: ${{ vars.VITE_ENABLE_PREVIEW }}

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
