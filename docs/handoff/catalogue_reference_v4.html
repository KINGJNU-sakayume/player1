<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARC Music — Catalogue V4 Reference</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#f1eee6;--paper:#f8f5ee;--surface:#e7e2d8;--ink:#171917;--muted:#6b6d67;--dim:#969991;
 --line:rgba(23,25,23,.16);--line2:rgba(23,25,23,.08);--main:#eaa2bf;--dark:#161416;
 --en:"IBM Plex Sans",sans-serif;--ko:"Noto Sans KR",sans-serif;--ja:"Noto Sans JP",sans-serif;
}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%}
body{overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--en),var(--ko),var(--ja),sans-serif}
button{font:inherit;color:inherit}.app{height:100vh;display:grid;grid-template-columns:68px 1fr}
.rail{border-right:1px solid var(--line2);display:flex;flex-direction:column;align-items:center;padding:16px 0;background:rgba(248,245,238,.75)}
.logo{width:42px;height:50px;border:1px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:13px}
.nav{margin-top:24px;display:flex;flex-direction:column;gap:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.active{background:var(--main)}
.shell{display:grid;grid-template-rows:66px 1fr}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 30px;border-bottom:1px solid var(--line2);font-size:14px;color:var(--dim)}
.stage{min-height:0;display:grid;grid-template-columns:minmax(420px,44%) minmax(520px,56%);gap:72px;align-items:center;padding:28px 72px}
.left{display:flex;justify-content:center}.art{width:min(55vh,34vw,650px)}.cover{aspect-ratio:1;position:relative}
.cover:before{content:"";position:absolute;inset:7% -6% -8% 8%;background:rgba(234,162,191,.28);filter:blur(44px)}
.cover img{position:relative;width:100%;height:100%;object-fit:cover;box-shadow:0 0 0 1px var(--line2)}
.meta{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:end;margin-top:18px}.meta h1{font-size:52px;line-height:.95;letter-spacing:-.045em;margin:0 0 8px;font-weight:500}.meta p{margin:0;font-size:16px;color:var(--muted)}
.palette{display:flex;gap:4px}.palette i{width:22px;height:5px;display:block}
.right{height:min(68vh,760px);display:grid;grid-template-rows:auto 1fr auto;gap:18px}.lyrics-head{border-bottom:1px solid var(--line);padding-bottom:10px;display:flex;justify-content:space-between;color:var(--dim);font-size:14px}
.lyrics{display:flex;flex-direction:column;justify-content:center}.current{font-size:60px;line-height:1.05;letter-spacing:-.045em;font-weight:500}.translation{font-size:19px;color:var(--muted);margin-top:12px}.next{font-size:22px;color:var(--muted);margin-top:28px}.next div+div{margin-top:13px;color:var(--dim)}
.controls{border-top:1px solid var(--line);padding-top:14px;display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center}.buttons{display:flex;gap:6px}.buttons button{border:0;background:transparent;padding:7px}.buttons .play{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--paper)}
.progress{display:grid;grid-template-columns:42px 1fr 42px;gap:9px;align-items:center;font-size:13px;color:var(--dim)}.bar{height:3px;background:var(--surface);position:relative}.bar span{position:absolute;inset:0 47% 0 0;background:var(--main)}
.volume{font-size:13px;color:var(--dim)}
@media(max-width:1200px){.stage{gap:38px;padding:28px 38px}.current{font-size:52px}.meta h1{font-size:46px}}
</style>
</head>
<body>
<div class="app">
 <aside class="rail">
   <div class="logo">ARC</div>
   <div class="nav"><span class="dot active"></span><span class="dot"></span><span class="dot"></span></div>
 </aside>
 <main class="shell">
  <header class="top"><span>Now Playing / EARFQUAKE</span><span>Catalogue Reference</span></header>
  <section class="stage">
   <div class="left">
    <div class="art">
     <div class="cover"><img src="https://i.scdn.co/image/ab67616d00001e0230a635de2bb0caa4e26f6abb" alt="IGOR cover"></div>
     <div class="meta">
      <div><h1>EARFQUAKE</h1><p>Tyler, The Creator · IGOR</p></div>
      <div class="palette"><i style="background:#eaa2bf"></i><i style="background:#2d292b"></i><i style="background:#f6d8e4"></i><i style="background:#161416"></i></div>
     </div>
    </div>
   </div>
   <div class="right">
    <div class="lyrics-head"><span>LYRICS</span><span>Translation on</span></div>
    <div class="lyrics">
      <div class="current">A bright pulse runs under the floor</div>
      <div class="translation">밝은 맥박이 바닥 아래로 흐른다</div>
      <div class="next"><div>You disappear and return in the same frame</div><div>Nothing stays still for very long</div></div>
    </div>
    <div class="controls">
      <div class="buttons"><button>◀</button><button class="play">Ⅱ</button><button>▶</button></div>
      <div class="progress"><span>0:57</span><div class="bar"><span></span></div><span>3:10</span></div>
      <div class="volume">VOL 62</div>
    </div>
   </div>
  </section>
 </main>
</div>
</body>
</html>
